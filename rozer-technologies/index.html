<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: use only the R monogram -->
    <link rel="icon" type="image/png" href="/log.png" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Rozer Technologies | Technology Consulting & Custom Software
    </title>

    <meta
      name="description"
      content="Rozer Technologies helps businesses identify technology opportunities, modernize operations, automate workflows, and build custom software, AI, and digital solutions."
    />

    <meta
      name="keywords"
      content="technology consulting, digital transformation, custom software development, business automation, AI solutions, ERP, CRM, HRMS, web application development, software company India, Rozer Technologies"
    />

    <meta name="author" content="Rozer Technologies" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://rozer.online/"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#0A0E1C"
    />

    <!-- Open Graph / LinkedIn / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Rozer Technologies | Turn Business Challenges Into Technology Opportunities"
    />

    <meta
      property="og:description"
      content="Technology consulting, digital transformation, business automation, AI solutions, custom software development, and ongoing technology management."
    />

    <meta
      property="og:url"
      content="https://rozer.online/"
    />

    <meta
      property="og:site_name"
      content="Rozer Technologies"
    />

    <meta
      property="og:image"
      content="https://rozer.online/og-image.png"
    />

    <!-- X / Twitter Card -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Rozer Technologies | Technology Consulting & Custom Software"
    />

    <meta
      name="twitter:description"
      content="We understand the business first, identify the right technology opportunities, then design, build, implement and improve the solution."
    />

    <meta
      name="twitter:image"
      content="https://rozer.online/og-image.png"
    />

    <!-- Search Engine -->
    <meta
      name="robots"
      content="index, follow"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
